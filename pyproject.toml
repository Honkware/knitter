[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knitter"
version = "0.1.0"
description = "Polite, zero-dependency Nitter RSS reader with a local SQLite archive and boolean filtering."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
knitter = "knitter:main"

[tool.setuptools]
py-modules = ["knitter"]
